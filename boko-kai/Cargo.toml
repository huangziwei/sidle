[package]
name = "boko-kai"
version = "0.3.0+kai.1"
edition = "2024"
description = "Private modified (kai 改) fork of boko with extra CJK typography support; consumed only by sidle"
license = "GPL-3.0-or-later"
publish = false
readme = "README.md"

# Library import name is kept as `boko` so dependents continue to
# `use boko::...` without churn.
[lib]
name = "boko"
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
# `cli` implies `aozora`: the CLI bin (`main.rs`) calls `boko::aozora::*`.
cli = ["dep:clap", "dep:serde", "dep:serde_json", "dep:ion-rs", "aozora"]
# Aozora Bunko TXT → EPUB. Pulls the heavy SVG/text stack (resvg + its font /
# raster deps) plus `regex`; gated off for wasm to shrink the binary.
aozora = ["dep:resvg", "dep:regex"]
wasm = ["wasm-bindgen", "console_error_panic_hook"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
quick-xml = "0.39"
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }
percent-encoding = "2.3"

# High-performance byte operations (SIMD-accelerated)
memchr = "2.7"
bstr = { version = "1.11", default-features = false, features = ["alloc"] }

html5ever = "0.39"
cssparser = "0.36"
selectors = "0.35"
precomputed-hash = "0.1"

# Encoding detection and conversion (UTF-8, CP1252, etc.)
encoding_rs = "0.8"

# Regex engine. Used by the Aozora Bunko TXT parser (annotations.rs and
# parser_txt.rs) — the source format is markup-heavy and the JS reference
# tool we're porting relies on ~40 regex patterns.
regex = { version = "1.11", optional = true }

# SVG rasterization for Aozora cover generation. We build the cover as
# pure SVG (port of `buildCoverSvg` from `aozora-epub.html`) and rasterize
# it to a JPEG for the EPUB. `system-fonts` feature pulls macOS fonts
# (Hiragino Mincho ProN etc.) into usvg's fontdb at runtime — Aozora is
# personal software per [[feedback_personal_software_no_other_users]], no
# bundled fallback font needed.
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts"], optional = true }

# Base64 encoding for KFX raw media
base64 = "0.22"

# Pure-Rust JPEG encoder. Used by the kfx_to_epub mechanical port to
# re-encode JPEG-XR images decoded from KFX into something EPUB readers
# can render. Small, focused, no C deps.
jpeg-encoder = { version = "0.6", default-features = false }

# Pure-Rust multi-format image decoder. Used by the EPUB→KFX path to
# transcode every non-JPEG image (GIF, PNG, WebP, BMP) to JPEG before
# bundling. KDP's "Image Guidelines — Reflowable" warns that Kindle
# can't render multi-frame GIFs and that transparent areas don't
# composite, and Amazon's authoritative KFX pipeline transcodes every
# input image to JPEG-XR. Matching that here means embedded images
# actually render on device instead of silently going missing. We pull
# only decoders here; JPEG encode stays on `jpeg-encoder` so existing
# call sites (Aozora cover, JXR re-encode) don't double up.
image = { version = "0.25", default-features = false, features = [
    "gif",
    "png",
    "webp",
    "bmp",
] }

# Ion binary format parsing for KFX dump tool
ion-rs = { version = "1.0.0-rc.11", features = ["experimental-reader-writer"], optional = true }

# SHA1 hashing for KFX content hashes (minimal, WASM-compatible).
# Used by the kfx-zip → kfx fast path. RustCrypto's `sha1 = "0.10"` with
# `features=["asm"]` was tried for speed but produced wrong digests on
# Apple Silicon — calibre rejected the output with "Incorrect
# kfxgen_payload_sha1". `sha1_smol` matches OpenSSL/hashlib on every
# platform we test, so we keep it as the single SHA1 implementation.
sha1_smol = { version = "1.0", features = ["std"] }

# CLI argument parsing (only for binary)
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
xml5ever = "0.39.0"

# Pure-Rust PDF parser. Used by the PDF→KFX path to read page count, per-page
# MediaBox dimensions, and /Info title+author. We only parse structure (the
# PDF is embedded verbatim and the device renders it), so the datetime/rayon
# default features are dropped; nom parser + flate2/crypto stay (hard deps).
lopdf = { version = "0.40", default-features = false }

# Native: use fast zlib-rs
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# PDF page rasterizer (PDF→KFX page-1 cover; later the desktop reader). pdfium
# is Chrome's PDF engine — no mature pure-Rust renderer exists. `pdfium-render`
# binds to a `libpdfium.dylib` at RUNTIME (so this compiles without it; the lib
# is bundled in Sidle.app / found via BOKO_PDFIUM_LIB or the system path). We
# take raw bitmap bytes and JPEG-encode via `jpeg-encoder`, so the heavy `image`
# integration features are off. We pin the binding ABI to `pdfium_7543` rather
# than `pdfium_latest` (7763): pdfium only ever *adds* C symbols, so a 7543
# binding loads cleanly against any pdfium >= 7543 — the bblanchon binary we
# ship (7763) AND the older system pdfium used for in-sandbox tests — whereas a
# 7763 binding fails to bind an older dylib (missing symbols). We don't call any
# post-7543 API. `thread_safe` mutex-guards the bindings for the Sidle worker.
# Native-only for now — the wasm/boko.html cover path (pdfium.wasm + JS glue) is
# a documented P2 follow-up; see .claude/plans/pdf-to-kfx.md.
pdfium-render = { version = "0.9.1", default-features = false, features = ["pdfium_7543", "thread_safe"] }

# WASM: use pure-Rust backend
[target.'cfg(target_arch = "wasm32")'.dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
js-sys = "0.3"
# lopdf's encrypted-PDF crypto deps pull `getrandom`, which has no default
# backend on wasm32-unknown-unknown. lopdf's `wasm_js` feature forwards to
# `getrandom/wasm_js` (the browser backend) so the PDF→KFX path builds for the
# boko.html tool too. Enabled only for the wasm target.
lopdf = { version = "0.40", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3.14"
proptest = "1.6"
criterion = "0.8"

[[bin]]
name = "boko"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "kfx-dump"
path = "src/bin/kfx-dump.rs"
required-features = ["cli"]

[[bench]]
name = "conversion"
harness = false
