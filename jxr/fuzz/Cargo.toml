[package]
name = "jxr-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
jxr = { path = ".." }

[[bin]]
name = "jxr_decode"
path = "fuzz_targets/jxr_decode.rs"
test = false
doc = false
bench = false

# Own workspace root: keeps nightly-only fuzz deps out of the repo workspace
# (also excluded from the root Cargo.toml) and out of the lifted-copy build.
[workspace]

[profile.release]
debug = 1
# Intent: fuzz the decoder with the SAME integer-overflow semantics it ships
# with (release wraps garbage-from-garbage; never panics). NOTE this profile
# line is NOT sufficient on its own — cargo-fuzz force-enables overflow checks
# ("--release but with debug assertions AND overflow checks enabled", see
# `cargo fuzz build --help`) and overrides it. The EFFECTIVE control is
# `RUSTFLAGS=-Coverflow-checks=off`, set by scripts/jxr-fuzz-overnight.sh; run
# the fuzzer through that script (or export it yourself). `cargo test -p jxr`
# keeps overflow-checks ON (dev profile), so overflow on VALID input still
# fails the test suite.
overflow-checks = false
