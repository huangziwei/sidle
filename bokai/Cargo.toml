[package]
name = "bokai"
version = "0.1.5"
edition = "2024"
description = "Ebook conversion engine (EPUB/KFX/AZW3/MOBI/PDF) with CJK typography support; a modified (改 kai) fork of boko"
license = "GPL-3.0-or-later"
publish = false
readme = "README.md"

[lib]
crate-type = ["rlib"]

# Two layers: the install targets a build selects, and the capabilities they are
# assembled from. `kfx` and `epub` are the floor and are not gated — every
# configuration converts between those two.
[features]
# --- install targets: one per build -----------------------------------------
default = ["desktop"]
# The host build: the complete CLI.
desktop = ["cli"]
# The Kindle build: KFX↔EPUB and the subcommands over it. `aozora`, `pdf` (a
# macOS-only renderer) and `validate` (2.7 MB of schemas) are absent, and the
# subcommands reaching them compile out along with their help text.
native = ["bin"]

# --- capabilities: named by a library consumer, bundled by the targets above -
# The complete command line: every subcommand over every format.
cli = ["bin", "aozora", "pdf", "validate"]
# The floor a `bokai` binary needs before any format capability: a command line
# to parse, a JSON writer to report through.
bin = ["dep:clap", "dep:serde", "dep:serde_json", "dep:ion-rs"]
# Aozora Bunko TXT → EPUB. The source format is markup-heavy and the parser is
# regex-heavy in turn; the generated cover is SVG, rasterized to JPEG.
aozora = ["dep:regex", "svg"]
# PDF as a source format: `import::pdf` probes one, `formats::pdf` reads and
# edits one, and the PDF→KFX route embeds one. `formats::pdf::structure` sits
# outside the gate; a PDF-backed KFX carries those facts in its own fragments.
pdf = ["dep:lopdf", "svg"]
# Source validation: the EPUB conformance suite (embedded RELAX NG / Schematron
# schemas, whose XPath assertions need a regex engine) and the KFX and TOC
# checks beside it.
validate = ["dep:regex"]
# SVG rasterization, for vector art bound for a raster-only target: KFX bundles
# no vector resource format, and PDF page assembly draws from SVG. A build
# without it refuses such a conversion; the artwork never silently drops.
svg = ["dep:resvg"]
# Kindle Scribe handwritten-notebook (.nbk) decode → SVG. Pulls `rusqlite`
# (bundled C SQLite). Off by default; enable it to read notebooks.
nbk = ["dep:rusqlite"]

[dependencies]
quick-xml = "0.39"
unicode-normalization = "0.1"
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }
percent-encoding = "2.3"

# High-performance byte operations (SIMD-accelerated)
memchr = "2.7"
bstr = { version = "1.11", default-features = false, features = ["alloc"] }

html5ever = "0.39"
cssparser = "0.36"
selectors = "0.35"
precomputed-hash = "0.1"

# Encoding detection and conversion (UTF-8, CP1252, etc.)
encoding_rs = "0.8"

# Regex engine, behind `aozora` and `validate`: the Aozora Bunko TXT parser
# (annotations.rs, parser_txt.rs) and the Schematron half of the EPUB
# validator, whose assertions call `matches`, `replace` and `tokenize`.
regex = { version = "1.11", optional = true }

# SVG rasterization, behind `svg`: EPUB→KFX asset plates, the Aozora cover,
# and `formats::pdf::assemble` page plates. `system-fonts` reaches host fonts
# for `<text>`; `raster-images` renders `<image>` elements embedding PNG/JPEG.
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts", "raster-images"], optional = true }

# Base64 encoding for KFX raw media
base64 = "0.22"

# Pure-Rust JPEG encoder, the single encoder in the crate: `formats::kfx::jxr`
# and `image::jpeg` re-encode decoded JPEG-XR through it, and it writes the
# Aozora cover and PDF page plates.
jpeg-encoder = { version = "0.6", default-features = false }

# Pure-Rust JPEG-XR codec (top-level workspace crate; zero deps). Decodes KFX
# raw media (KFX→EPUB + reader) and encodes EPUB→KFX interior plates.
# Re-exported as `bokai::jxr` since `model::Book`'s API exposes its types.
jxr = { path = "../jxr" }

# Pure-Rust multi-format image decoder. The EPUB→KFX path transcodes every
# non-JPEG image (GIF, PNG, WebP, BMP) to JPEG through it before bundling.
# Decoders only: JPEG encode stays on `jpeg-encoder`.
image = { version = "0.25", default-features = false, features = [
    "gif",
    "png",
    "webp",
    "bmp",
    "jpeg",
] }

# Ion binary format parsing for KFX dump tool
ion-rs = { version = "1.0.0-rc.11", features = ["experimental-reader-writer"], optional = true }

# SHA1 for KFX content hashes, on the kfx-zip → kfx fast path. Pure-Rust with
# no assembly backend: digests match OpenSSL and hashlib on every platform
# tested.
sha1_smol = { version = "1.0", features = ["std"] }

# CLI argument parsing (only for binary)
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
xml5ever = "0.39.0"

# Pure-Rust PDF parser, behind `pdf`: the PDF→KFX path reads page count,
# per-page MediaBox dimensions, and /Info title+author. Structure only — the
# datetime/rayon default features are dropped; nom + flate2/crypto stay.
lopdf = { version = "0.40", default-features = false, optional = true }

# Fast pure-Rust deflate backend.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# KDF/KPF SQLite reader for the `nbk` feature (Scribe notebooks). `bundled`
# compiles SQLite from source; no host libsqlite3 takes part.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# macOS PDF engine for the PDF→KFX page-1 cover and selectable text layer:
# Apple PDFKit (`PDFPage.draw(with:to:)`, `PDFPage.string`,
# `characterBounds(at:)`) over a Core Graphics bitmap context. See `render.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }
objc2-core-graphics = { version = "0.3", features = ["CGContext", "CGColorSpace", "CGImage", "CGPDFDocument", "CGPDFPage", "CGAffineTransform", "CGGeometry"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage"] }

[dev-dependencies]
tempfile = "3.14"
proptest = "1.6"

[[bin]]
name = "bokai"
path = "src/main.rs"
required-features = ["bin"]

[[bin]]
name = "kfx-dump"
path = "src/bin/kfx-dump.rs"
required-features = ["bin"]

# Integration tests that exercise an optional capability. A subset build skips
# each one it lacks the feature for.
[[test]]
name = "azw3_epub_export"
required-features = ["validate"]

[[test]]
name = "epub_spine_reorder"
required-features = ["validate"]

[[test]]
name = "validate_source_kfx"
required-features = ["validate"]

[[test]]
name = "kfx_pdf_pages"
required-features = ["pdf"]
