[package]
name = "sidle-core"
version.workspace = true
license.workspace = true
edition = "2024"
description = "Tauri-independent core for sidle: library DB, paths, import helpers."
publish = false

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# .yjr annotation handles are base64(type, eid, offset). 0.22.1 is already in
# the workspace lockfile, so this adds no network fetch.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }
# The Kindle gzips its own system logs; the reading-log import gunzips them.
# Already in the lockfile via zip's deflate-flate2, declared directly because
# `library::reading_log` names it.
flate2 = "1"
dirs = "6"
# Cover fetch (library::cover_fetch) — Amazon's `/images/P/<ASIN>` endpoint.
# rustls so we don't pull in system OpenSSL; `blocking` because the whole
# conversion path is synchronous and its callers already own a thread for it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "blocking"] }

# Romanization for the searchable `title_romaji`/`author_romaji` metadata + the
# picker's derived search key (library::romaji). Host-only (desktop/server), so
# binary size is a non-issue. `kakasi` (kanji + kana → rōmaji) bundles its own
# dictionary via `phf` — no external dict download like `lindera` would need;
# GPL-3.0, link-compatible with the AGPL-3.0-or-later workspace (same lineage as
# bokai). `pinyin` (Han → tone-less pīnyīn) is a zero-dep bundled table.
# `unicode-normalization` ASCII-folds romaji/accents (ō→o) in `canon`.
kakasi = "0.1"
pinyin = "0.11"
unicode-normalization = "0.1"

bokai = { path = "../../bokai", default-features = false, features = ["aozora", "nbk"] }

# image: cover thumbnail decode + grayscale + downscale, produced at import
# time (see library::thumbnail). Host-only (server/desktop), so unlike
# sidle-native we don't sweat binary size — but still feature-gate to the
# cover formats we actually decode (jpg/png).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# rcgen: issues the private CA + server leaf for the LAN server's TLS
# (library::tls). Host-only, so its default `ring` backend is fine — the armv7
# picker's no-C constraint applies to the client side, not here. The
# `x509-parser` feature is what provides `Issuer::from_ca_cert_pem`, so the
# issuer is read from the CA actually on disk rather than re-derived from
# parameters that could drift away from it.
rcgen = { version = "0.14.8", features = ["x509-parser"] }

# Free-space reporting for a mounted Kindle: `statvfs` on the volume, which is
# what the picker's "will it fit" check reads.
libc = "0.2"
# Hex-encodes the sha256 digests the on-device deploy compares source against
# device with.
hex = "0.4"
# Pure-Rust MTP transport for Scribe and other 2024+ Kindles that dropped USB
# mass storage. Pinned exact (young crate, recent API churn) — bump
# deliberately and rerun the device round-trip when upgrading. mtp-rs's
# nusb-backed enumeration explicitly handles Amazon Kindle's vendor-specific
# interface descriptors.
mtp-rs = "=0.15.0"
# Drives mtp-rs's async API from the sync `Transport` trait via
# `futures::executor::block_on`. mtp-rs is runtime-agnostic (no tokio in its
# Cargo.toml main deps), so a plain futures executor is enough — avoids
# nested-tokio-runtime panics that `tokio::runtime::Runtime::block_on` would
# trigger inside a blocking task.
futures = "0.3"
# Stream chunk type for `Storage::upload` — wraps a `Vec<u8>` cheaply for the
# single-chunk upload path. Transitive via mtp-rs; declared directly so our code
# reads clean.
bytes = "1"
# USB device enumeration. Already transitive via mtp-rs; declared directly so
# mass-storage detect can read a mounted Kindle's real serial from its USB
# `iSerial` descriptor — the serial is NOT in system/version.txt. Pinned to the
# locked transitive version so cargo doesn't resolve two copies of nusb.
nusb = "=0.2.3"
# Stages orphan KFXes pulled off the device (via MTP `GetObject`) to a real file
# path so the extension-dispatch import pipeline can consume them —
# mass-storage hands us a path natively; MTP needs the round-trip.
tempfile = "3"

[dev-dependencies]
tempfile = "3"
# Reads back the certificates `library::tls` issues, to assert what actually
# landed in the DER (SANs, issuer linkage, validity window) rather than trusting
# that rcgen was asked for the right thing. Already in the lockfile via rcgen.
x509-parser = "0.18"
