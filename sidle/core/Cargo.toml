[package]
name = "sidle-core"
version = "0.1.0"
edition = "2024"
description = "Tauri-independent core for sidle: library DB, paths, import helpers."
publish = false

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }
dirs = "6"

boko-kai = { path = "../../boko-kai", default-features = false }

[dev-dependencies]
tempfile = "3"
