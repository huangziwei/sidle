[package]
name = "sidle-core"
version.workspace = true
license.workspace = true
edition = "2024"
description = "Tauri-independent core for sidle: library DB, paths, import helpers."
publish = false

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# .yjr annotation handles are base64(type, eid, offset). 0.22.1 is already in
# the workspace lockfile, so this adds no network fetch.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }
# The Kindle gzips its own system logs; the reading-log import gunzips them.
# Already in the lockfile via zip's deflate-flate2, declared directly because
# `library::reading_log` names it.
flate2 = "1"
dirs = "6"

# Romanization for the searchable `title_romaji`/`author_romaji` metadata + the
# picker's derived search key (library::romaji). Host-only (desktop/server), so
# binary size is a non-issue. `kakasi` (kanji + kana → rōmaji) bundles its own
# dictionary via `phf` — no external dict download like `lindera` would need;
# GPL-3.0, link-compatible with the AGPL-3.0-or-later workspace (same lineage as
# bokai). `pinyin` (Han → tone-less pīnyīn) is a zero-dep bundled table.
# `unicode-normalization` ASCII-folds romaji/accents (ō→o) in `canon`.
kakasi = "0.1"
pinyin = "0.11"
unicode-normalization = "0.1"

bokai = { path = "../../bokai", default-features = false, features = ["aozora", "nbk"] }

# image: cover thumbnail decode + grayscale + downscale, produced at import
# time (see library::thumbnail). Host-only (server/desktop), so unlike
# sidle-native we don't sweat binary size — but still feature-gate to the
# cover formats we actually decode (jpg/png).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# rcgen: issues the private CA + server leaf for the LAN server's TLS
# (library::tls). Host-only, so its default `ring` backend is fine — the armv7
# picker's no-C constraint applies to the client side, not here. The
# `x509-parser` feature is what provides `Issuer::from_ca_cert_pem`, so the
# issuer is read from the CA actually on disk rather than re-derived from
# parameters that could drift away from it.
rcgen = { version = "0.14.8", features = ["x509-parser"] }

[dev-dependencies]
tempfile = "3"
# Reads back the certificates `library::tls` issues, to assert what actually
# landed in the DER (SANs, issuer linkage, validity window) rather than trusting
# that rcgen was asked for the right thing. Already in the lockfile via rcgen.
x509-parser = "0.18"
