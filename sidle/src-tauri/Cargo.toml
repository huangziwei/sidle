[package]
name = "sidle"
version = "0.1.0"
edition = "2024"
description = "sidle: EPUB library + KFX converter + Kindle sync"
publish = false

[lib]
name = "sidle_lib"
crate-type = ["rlib"]

[[bin]]
name = "sidle"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "fs", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
libc = "0.2"
# rustls so we don't pull in system OpenSSL on macOS/Linux. Only used for
# the cover-fetch path (amazon.co.jp /images/P/<ASIN>.09.LZZZZZZZ.jpg).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

boko-kai = { path = "../../boko-kai", default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
