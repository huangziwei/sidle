[package]
name = "sidle"
version = "0.1.0"
edition = "2024"
description = "sidle: EPUB library + KFX converter + Kindle sync"
publish = false

[lib]
name = "sidle_lib"
crate-type = ["rlib"]

[[bin]]
name = "sidle"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "fs", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# Hex-encode sha256 digests for the KUAL deploy staleness check, where
# source-vs-device hashes are surfaced to the frontend as strings.
hex = "0.4"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
libc = "0.2"
# rustls so we don't pull in system OpenSSL on macOS/Linux. Only used for
# the cover-fetch path (amazon.co.jp /images/P/<ASIN>.09.LZZZZZZZ.jpg).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Used by the post-fetch EPUB cover swap (rewrite the zip with new cover
# bytes). Match boko-kai's version so we don't pull in two zip crates.
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }

boko-kai = { path = "../../boko-kai", default-features = false }
sidle-core = { path = "../core" }
sidle-server = { path = "../server" }
tracing = "0.1"
# Reader resources (images, css) are returned base64-encoded in the reader_open
# DTO. 0.22 matches sidle-core so we don't pull in two base64 crates.
base64 = "0.22"

# Watch the daemon's `<data-dir>/.sync-pulse.json` to live-repaint an open reader
# after a LAN annotation sync (the detached sidle-server can't emit a Tauri event
# into this process). FSEvents-backed on macOS. See sidle-reader.md P3.
notify = "8"

# Pure-Rust MTP transport for Scribe and other 2024+ Kindles that dropped USB
# mass storage. Pinned exact (young crate, recent API churn) — bump
# deliberately and rerun the device round-trip when upgrading. mtp-rs's
# nusb-backed enumeration explicitly handles Amazon Kindle's vendor-specific
# interface descriptors; see ref/mtp-rs/src/transport/nusb.rs.
mtp-rs = "=0.15.0"
# Drives mtp-rs's async API from the sync `Transport` trait via
# `futures::executor::block_on`. mtp-rs is runtime-agnostic (no tokio in its
# Cargo.toml main deps), so a plain futures executor is enough — avoids
# nested-tokio-runtime panics that `tokio::runtime::Runtime::block_on` would
# trigger inside `spawn_blocking`.
futures = "0.3"
# Stream chunk type for `Storage::upload` — wraps a `Vec<u8>` cheaply for
# the single-chunk upload path. Transitive via mtp-rs; declared directly so
# our code reads clean.
bytes = "1"
# USB device enumeration. Already transitive via mtp-rs; declared directly so
# mass-storage detect can read a mounted Kindle's real serial from its USB
# `iSerial` descriptor — the serial is NOT in system/version.txt. Pinned to the
# locked transitive version so cargo doesn't resolve two copies of nusb.
nusb = "=0.2.3"
# Stages orphan KFXes pulled off the device (via MTP `GetObject`) to a real
# file path so the existing extension-dispatch import pipeline can consume
# them — mass-storage hands us a path natively; MTP needs the round-trip.
tempfile = "3"

# macOS App Nap suppression. When the app window is backgrounded (the user is
# reading on the Kindle), App Nap throttles the whole process — the tokio
# reactor/timers get coalesced by tens of seconds, so the embedded LAN server
# answers too late for the KUAL picker's 3s timeout and the Kindle shows
# "can't reach server". We hold a process-lifetime NSProcessInfo activity
# assertion to opt out (see lib.rs::disable_app_nap). objc2-foundation is
# already in the tree via Tauri; declared directly with just the two classes
# we touch.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }

[dev-dependencies]

[features]
custom-protocol = ["tauri/custom-protocol"]
