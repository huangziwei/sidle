[package]
name = "sidle-native"
version.workspace = true
license.workspace = true
edition = "2024"
publish = false

[lib]
name = "sidle_native"
path = "src/lib.rs"

[[bin]]
# Named after the package. The desktop app's bin is `sidle`; two same-named bins
# in one workspace share one `target/release/<name>`. build.sh renames this to
# `native/sidle` at copy time.
name = "sidle-native"
path = "src/main.rs"

[dependencies]
# libc: raw open/ioctl/mmap. Pure Rust, no C build script — the rust-lld cross
# path holds without zig.
libc = "0.2"
# anyhow: error propagation in the on-device run loop, which captures context
# strings and logs the full chain on failure.
anyhow = "1"
# ureq: small sync HTTP client over TLS. `rustls-no-provider` is load-bearing —
# a TLS feature bundling ring runs ring's C build script and ends the rust-lld
# cross path. NO `rustls-webpki-roots`: `etc/ca.pem` is this binary's only root.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider"] }
# rustls with no provider features of its own, same constraint. `tls12` is off:
# both ends of every connection here are this project's, and TLS 1.3 alone is a
# smaller surface.
rustls = { version = "0.23", default-features = false, features = ["std"] }
# RustCrypto's provider: a pure-Rust graph and a static musl cross-link with no C
# toolchain. `rev` matches sidle-server's dev-dependency pin, whose test drives
# both ends. Unaudited glue over `aes-gcm`/`p256`/`sha2`, for two-party traffic.
rustls-rustcrypto = { git = "https://github.com/RustCrypto/rustls-rustcrypto", rev = "7b44a2de957b6596d267a920d3aec0d4137defb1", default-features = false, features = ["std"] }
# serde + serde_json: JSON deserialize of the server's `/list.json`, and
# serialize of the `/sync/annotations` push bundle. `derive` is proc-macro
# driven, pure Rust at build time.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# flate2: gunzip the firmware's own `system/logbackup/*.txt.gz` reading logs.
# `rust_backend` (miniz_oxide), not the default zlib: the static musl cross-link
# admits no C dependency. Read-only.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# base64: encode `.yjr`/`.yjf` bytes for the `/sync/annotations` JSON body
# (STANDARD alphabet, with padding — matching the server's decoder). Pure Rust,
# no_std-capable. 0.22 matches the desktop.
base64 = "0.22"
# sha2 + hex: hash the on-device picker binary against the LAN self-update
# manifest, and sha256-verify a download before staging it as `bin/sidle.new`.
# Pure Rust, `asm` off; the desktop's versions, giving device and Mac one digest.
sha2 = "0.10"
hex = "0.4"
# ab_glyph: TTF rasterizer over the Kindle's own bundled faces in
# /usr/java/lib/fonts/, with no font shipped. It outlines a glyph on request,
# holding a 23.5 MB CJK face in 24 MB. ab_glyph_rasterizer has no deps.
ab_glyph = "0.2"
# image: cover JPG/PNG decode + resize. Feature-gated to just the two
# formats the server returns (.jpg from EPUB / Amazon, occasional .png).
# All sub-deps (jpeg-decoder, png) are pure Rust.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# x11rb: pure-Rust X11 client. RustConnection speaks the wire protocol over the
# socket, making Sidle a WM-managed window the framework composites and tears
# down. NO `allow-unsafe-code`: it links the system `libxcb` (`-lxcb`).
x11rb = { version = "0.13", default-features = false }
