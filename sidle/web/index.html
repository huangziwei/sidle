<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sidle</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">sidle</div>

      <div class="toolbar-group">
        <button id="btn-add" class="btn">Add EPUB&hellip;</button>
        <div class="seg" role="tablist" aria-label="View">
          <button id="view-gallery" class="seg-btn active" role="tab" aria-selected="true">Gallery</button>
          <button id="view-list" class="seg-btn" role="tab" aria-selected="false">List</button>
        </div>
      </div>

      <div class="toolbar-spacer"></div>

      <div class="device" id="device">
        <button type="button" id="device-pill" class="device-pill">
          <span class="device-dot disconnected"></span>
          <span id="device-pill-label">No Kindle</span>
        </button>
        <div class="device-popover" id="device-popover" hidden>
          <header class="device-popover-header">
            <strong id="device-popover-title">Kindle</strong>
            <span id="device-popover-status" class="device-popover-status disconnected">Disconnected</span>
          </header>
          <div class="device-actions">
            <button type="button" id="btn-send-unsent" class="btn-link" disabled>Send all unsent</button>
            <span id="device-send-progress" class="device-send-progress" hidden></span>
          </div>
          <dl class="device-fields">
            <dt>Model</dt><dd id="device-model">—</dd>
            <dt>Serial</dt><dd id="device-serial">—</dd>
            <dt>Free space</dt><dd id="device-free">—</dd>
            <dt>On device</dt><dd id="device-count">—</dd>
          </dl>
          <ul id="device-sent-list" class="device-sent-list" aria-label="Books on device"></ul>
          <div id="device-empty" class="device-empty">Nothing sent yet.</div>
        </div>
      </div>

      <label class="workers">
        Workers
        <select id="workers">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="6">6</option>
          <option value="8">8</option>
        </select>
      </label>
    </header>

    <main id="main">
      <section id="gallery" class="view active" aria-label="Gallery">
        <div id="gallery-grid" class="gallery-grid"></div>
        <div id="gallery-empty" class="empty">
          <p>Drop an EPUB anywhere to import.</p>
        </div>
      </section>

      <section id="list" class="view" aria-label="List" hidden>
        <table class="book-table">
          <colgroup id="book-cols">
            <col data-col="title">
            <col data-col="author">
            <col data-col="language">
            <col data-col="imported_at">
            <col data-col="file_size">
            <col data-col="formats">
            <col data-col="on_kindle">
          </colgroup>
          <thead>
            <tr>
              <th data-col="title" data-sort="title">Title<span class="resizer"></span></th>
              <th data-col="author" data-sort="author">Author<span class="resizer"></span></th>
              <th data-col="language" data-sort="language">Lang<span class="resizer"></span></th>
              <th data-col="imported_at" data-sort="imported_at">Date added<span class="resizer"></span></th>
              <th data-col="file_size" data-sort="file_size">Size<span class="resizer"></span></th>
              <th data-col="formats">Formats<span class="resizer"></span></th>
              <th data-col="on_kindle" data-sort="on_kindle">On Kindle<span class="resizer"></span></th>
            </tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
        <div id="list-empty" class="empty">
          <p>Drop an EPUB anywhere to import.</p>
        </div>
      </section>
    </main>

    <footer id="status-bar" class="status-bar">
      <button id="status-bar-toggle" class="status-bar-toggle" type="button">
        <span class="dot" id="status-bar-dot"></span>
        <span id="status-bar-summary">No conversions running</span>
      </button>
    </footer>

    <aside id="queue-drawer" class="queue-drawer" hidden aria-label="Conversion queue">
      <header class="queue-drawer-header">
        <strong>Conversion queue</strong>
        <button id="queue-drawer-close" class="btn-link" type="button">Hide</button>
      </header>
      <ul id="queue-list" class="queue-list"></ul>
      <div id="queue-empty" class="queue-empty">Nothing in flight.</div>
    </aside>

    <div id="drop-veil" class="drop-veil" hidden>
      <div class="drop-veil-inner">Drop to import</div>
    </div>

    <ul id="ctx-menu" class="ctx-menu" hidden></ul>

    <div id="toast" class="toast" hidden></div>

    <script src="api.js"></script>
    <script src="library.js"></script>
  </body>
</html>
