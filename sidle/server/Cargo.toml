[package]
name = "sidle-server"
version = "0.1.0"
edition = "2024"
description = "sidle LAN HTTP server — read-only library access for KUAL pulls and (later) browser-based management."
publish = false

[[bin]]
name = "sidle-server"
path = "src/main.rs"

[lib]
name = "sidle_server"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
sidle-core = { path = "../core" }

anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
hex = "0.4"
mime_guess = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
