[package]
name = "sidle-server"
version.workspace = true
license.workspace = true
edition = "2024"
description = "sidle LAN HTTP server — read-only library access for on-device app pulls and (later) browser-based management."
publish = false

[[bin]]
name = "sidle-server"
path = "src/main.rs"

[lib]
name = "sidle_server"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
sidle-core = { path = "../core" }

anyhow = "1"
axum = "0.8"
# Annotation `.yjr`/`.yjf` blobs ride in the `POST /sync/annotations` JSON body
# as base64. 0.22 matches sidle-core / src-tauri so we don't pull a second copy.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
hex = "0.4"
mime_guess = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
# axum-server: the TLS listener. `tls-rustls-no-provider` rather than
# `tls-rustls` because the latter pulls `aws-lc-rs`, whose cmake/C build would be
# a new toolchain requirement — `ring` is already in the workspace graph (via
# reqwest in src-tauri), so we install that provider explicitly instead and add
# no C dependency that wasn't already there.
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }

[dev-dependencies]
tempfile = "3"
# The TLS test drives the server with the *device's* client stack, not the
# host's: ureq 3 with the pure-Rust RustCrypto provider and our CA as the sole
# root. Using reqwest/ring here would prove the server speaks TLS to something,
# which isn't the question — the question is whether the constrained client that
# has to accept our leaf actually does.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider"] }
rustls-rustcrypto = "0.0.2-alpha"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# `Router::oneshot` for in-process handler tests (the `/sync/annotations` gate)
# without binding a socket — drives the full route + DefaultBodyLimit layer.
tower = { version = "0.5", features = ["util"] }
