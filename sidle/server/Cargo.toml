[package]
name = "sidle-server"
version.workspace = true
license.workspace = true
edition = "2024"
description = "sidle LAN HTTP server — read-only library access for on-device app pulls and (later) browser-based management."
publish = false

[[bin]]
name = "sidle-server"
path = "src/main.rs"

[lib]
name = "sidle_server"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
sidle-core = { path = "../core" }

anyhow = "1"
axum = "0.8"
# Annotation `.yjr`/`.yjf` blobs ride in the `POST /sync/annotations` JSON body
# as base64. 0.22 matches sidle-core / the desktop app so we don't pull a second copy.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
hex = "0.4"
mime_guess = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
# axum-server: the TLS listener. `tls-rustls-no-provider` rather than
# `tls-rustls` because the latter pulls `aws-lc-rs`, whose cmake/C build would be
# a new toolchain requirement — `ring` is already in the workspace graph (via
# reqwest in the desktop app), so we install that provider explicitly instead and add
# no C dependency that wasn't already there.
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
# No `tls12`: both ends of every connection are ours — this server and the
# picker — so there is nothing to be compatible with. TLS 1.3 only removes a
# protocol version's worth of attack surface and negotiation for free. The
# picker must be built the same way; a 1.2-only client would simply fail to
# handshake, which is the correct outcome rather than a silent downgrade.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
tempfile = "3"
# The TLS test drives the server with the *device's* client stack, not the
# host's: ureq 3 with the pure-Rust RustCrypto provider and our CA as the sole
# root. Using reqwest/ring here would prove the server speaks TLS to something,
# which isn't the question — the question is whether the constrained client that
# has to accept our leaf actually does.
#
# Note that ureq enables `rustls/tls12` unconditionally, and cargo unifies
# features, so the server *as built for tests* carries TLS 1.2 support the
# shipped binary does not (`cargo tree -e features,no-dev -i rustls` to confirm
# the real thing is 1.3-only). Harmless: both sides offer 1.3, so 1.3 is what
# the test negotiates and exercises. The only untested delta is the server
# refusing a 1.2 ClientHello, which is rustls' behaviour rather than ours.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider"] }
# Pinned to a git rev, not the crates.io `0.0.2-alpha`: that release is from
# April 2024 and lags the repo badly. The crate is glue rather than
# cryptography — it maps `aes-gcm`, `chacha20poly1305`, `p256`, `rsa`, the
# `*-dalek` crates and `sha2` onto rustls' provider traits — and it lives under
# the RustCrypto org itself. Not independently audited; accepted knowingly,
# because it is the only way to keep the picker's armv7 cross-link free of C.
# Keep this rev identical to the one sidle-native builds against, or the test
# stops standing in for the device.
rustls-rustcrypto = { git = "https://github.com/RustCrypto/rustls-rustcrypto", rev = "7b44a2de957b6596d267a920d3aec0d4137defb1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# `Router::oneshot` for in-process handler tests (the `/sync/annotations` gate)
# without binding a socket — drives the full route + DefaultBodyLimit layer.
tower = { version = "0.5", features = ["util"] }
