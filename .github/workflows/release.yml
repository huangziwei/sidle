# Release attaches the assets a tag names. release-check.sh parses the tag;
# README.md documents the grammar.

name: Release

on:
    release:
        types: [published]
    # workflow_dispatch builds bokai and attaches nothing.
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  # release-check.sh reads every tag and the history behind it.
                  fetch-depth: 0

            # release-check.sh names the products the tag claims, exits nonzero
            # on a false claim, and writes bokai_build and bokai_check for the
            # steps below.
            - name: What this release covers
              id: scope
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  rc=0
                  ./release-check.sh ${TAG:+"$TAG"} >"$RUNNER_TEMP/scope.txt" 2>&1 || rc=$?
                  {
                      echo '### Release scope'
                      echo
                      echo '```'
                      cat "$RUNNER_TEMP/scope.txt"
                      echo '```'
                  } >>"$GITHUB_STEP_SUMMARY"
                  cat "$RUNNER_TEMP/scope.txt"
                  exit $rc

            # rust-toolchain.toml pins the compiler this job runs.
            - name: Show the pinned toolchain
              run: |
                  rustup show active-toolchain
                  rustc -vV
                  cargo clippy --version

            - name: Format
              run: cargo fmt --all --check

            - uses: actions/cache@v4
              if: steps.scope.outputs.bokai_check == 'true'
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

            # `--features native` is build-bokai.sh's feature set, gating the
            # code that ships in the zip.
            - name: Lint and test bokai
              if: steps.scope.outputs.bokai_check == 'true'
              run: |
                  cargo clippy -p bokai --no-default-features --features native --all-targets -- -D warnings
                  cargo test -p bokai --no-default-features --features native

            # .cargo/config.toml names rust-lld as the cross linker, and rustup
            # keeps it inside the toolchain. The host triple differs between
            # runners.
            - name: Put rust-lld on PATH
              if: steps.scope.outputs.bokai_build == 'true'
              run: |
                  ln -sf "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | awk '/^host:/ {print $2}')/bin/rust-lld" \
                      ~/.cargo/bin/rust-lld

            - name: Build the install tree
              if: steps.scope.outputs.bokai_build == 'true'
              env:
                  # BOKAI_BUILD reaches `bokai --version`. github.ref_name
                  # stands in on a dry run.
                  BOKAI_BUILD: ${{ github.event.release.tag_name || github.ref_name }}
              # build-bokai.sh writes both ABIs into device/extensions/bokai.
              run: |
                  ./build-bokai.sh armhf
                  ./build-bokai.sh armsf

            - name: Package
              if: steps.scope.outputs.bokai_build == 'true'
              env:
                  NAME: ${{ steps.scope.outputs.asset }}
              run: |
                  set -eu
                  mkdir -p dist
                  # `cd device` puts extensions/bokai at the archive root.
                  (cd device && zip -qr "../dist/$NAME.zip" extensions/bokai)
                  (cd dist && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
                  ls -lh "dist/$NAME.zip"
                  unzip -l "dist/$NAME.zip"

            - name: Attach to the release
              if: github.event_name == 'release' && steps.scope.outputs.bokai_build == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.release.tag_name }}
                  NAME: ${{ steps.scope.outputs.asset }}
              # `--clobber` replaces an asset of the same name.
              run: |
                  gh release upload "$TAG" \
                    "dist/$NAME.zip" \
                    "dist/$NAME.zip.sha256" \
                    --clobber

            - name: Keep the tree from a manual run
              if: github.event_name != 'release' && steps.scope.outputs.bokai_build == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.scope.outputs.asset }}
                  path: device/extensions/bokai
