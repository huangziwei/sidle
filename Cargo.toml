[workspace]
resolver = "3"
members = [
    "bokai",
    "jxr",
    "sidle/cli",
    "sidle/core",
    "sidle/native",
    "sidle/server",
    "sidle/desktop",
]
# The fuzz harness is nightly-only and must never enter normal builds; it is
# its own workspace (cargo-fuzz convention).
exclude = ["jxr/fuzz"]

# Single source of truth for the sidle-* crates' version. Each opts in with
# `version.workspace = true`, so bumping this one line versions the whole
# product in lockstep: the desktop app (+ tauri.conf.json, which falls back to
# the crate version), the LAN server, and the on-device picker binary (whose
# `CARGO_PKG_VERSION` is what `--update` logs). build.sh stamps the same value
# into the on-device config.xml. bokai is deliberately NOT here — it is an
# independent crate and versions on its own line.
[workspace.package]
version = "0.1.8"
# sidle's own crates are AGPL-3.0-or-later. bokai is deliberately excluded
# (it sets its own GPL-3.0-or-later directly, matching its upstream fork), so
# adding this here does not touch it. The two are link-compatible: GPLv3 §13
# permits combining a GPLv3 work with AGPLv3 code into a single conveyed work.
license = "AGPL-3.0-or-later"

[profile.dev]
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The on-device build (`--profile device`). `panic = "abort"` drops the unwind
# tables a Kindle has no use for; `bokai::util::parallel_map` joins its workers
# with `expect`, so a worker panic ends the process here and unwinds on release.
[profile.device]
inherits = "release"
lto = "fat"
panic = "abort"
strip = true
