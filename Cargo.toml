[workspace]
resolver = "3"
members = [
    "boko-kai",
    "sidle/core",
    "sidle/native",
    "sidle/server",
    "sidle/src-tauri",
]

# Single source of truth for the sidle-* crates' version. Each opts in with
# `version.workspace = true`, so bumping this one line versions the whole
# product in lockstep: the desktop app (+ tauri.conf.json, which falls back to
# the crate version), the LAN server, and the on-device picker binary (whose
# `CARGO_PKG_VERSION` is what `--update` logs). build.sh stamps the same value
# into the KUAL config.xml. boko-kai is deliberately NOT here — it tracks its
# upstream fork lineage (0.3.0+kai.N) on its own.
[workspace.package]
version = "0.1.1"
# sidle's own crates are AGPL-3.0-or-later. boko-kai is deliberately excluded
# (it sets its own GPL-3.0-or-later directly, matching its upstream fork), so
# adding this here does not touch it. The two are link-compatible: GPLv3 §13
# permits combining a GPLv3 work with AGPLv3 code into a single conveyed work.
license = "AGPL-3.0-or-later"

[profile.dev]
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Size-tuned profile for the browser-wasm `boko.html` tool. Must live here in the
# workspace root — Cargo ignores `[profile.*]` defined in member crates.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
