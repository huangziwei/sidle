[workspace]
resolver = "3"
members = [
    "bokai",
    "jxr",
    "sidle/cli",
    "sidle/core",
    "sidle/native",
    "sidle/render",
    "sidle/server",
    "sidle/desktop",
]
# jxr/fuzz is its own nightly-only cargo-fuzz workspace.
exclude = ["jxr/fuzz"]

# The sidle-* crates take this value through `version.workspace = true`.
# bokai carries its own.
[workspace.package]
version = "0.1.11"
# bokai sets its own GPL-3.0-or-later and takes nothing from here. GPLv3 §13
# permits the combined work.
license = "AGPL-3.0-or-later"

[profile.dev]
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The on-device build. `panic = "abort"` emits no unwind tables, and ends the
# process on a panic in `bokai::util::parallel_map`, which joins with `expect`.
[profile.device]
inherits = "release"
lto = "fat"
panic = "abort"
strip = true
