# Cross-compilation to the Kindle. Host (macOS) builds read nothing here.
#
#   cargo build --release --target armv7-unknown-linux-musleabihf -p sidle-native
#
# `link-self-contained=yes` links with rustc's bundled `rust-lld`, which the
# active toolchain ships outside `PATH`:
#
#   ln -sf "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | awk '/^host:/ {print $2}')/bin/rust-lld" \
#       ~/.cargo/bin/rust-lld

# Hardfloat: the Colorsoft, Scribe and KOA2.
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

# Soft-float: the Paperwhite 2 generation, built by `build-bokai.sh armsf`.
[target.armv7-unknown-linux-musleabi]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]
