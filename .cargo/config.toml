# Workspace cargo config.
#
# Target-specific only — keeps host (macOS) builds untouched and only kicks in
# when cross-compiling sidle-native to the Kindle.
#
# Build the on-device picker:
#   cargo build --release --target armv7-unknown-linux-musleabihf -p sidle-native
# Output: target/armv7-unknown-linux-musleabihf/release/sidle (~5MB static).
#
# armv7-unknown-linux-musleabihf = hardfloat NEON, matches the KOA2's Cortex-A9.
# musl = static link so the binary is firmware-version-agnostic.
#
# Linker: rustc's bundled rust-lld via `link-self-contained=yes`. This is the
# pure-Rust cross path — no zig, no GNU cross-binutils. Works as long as no
# crate in our graph has a C build-script. If that changes, the fallback is
# `brew install zig && cargo install cargo-zigbuild` and switching to
# `cargo zigbuild`.
#
# Prerequisite (one-time, host-architecture-agnostic): rust-lld is bundled with
# rustup but lives inside the active toolchain at
# `$(rustc --print sysroot)/lib/rustlib/<host-triple>/bin/rust-lld` — the host
# triple differs between Intel (`x86_64-apple-darwin`) and Apple Silicon
# (`aarch64-apple-darwin`) Macs, so this file must not hardcode it. Make it
# discoverable on PATH with one symlink that resolves the host triple at link
# time:
#
#   ln -sf "$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | awk '/^host:/ {print $2}')/bin/rust-lld" \
#       ~/.cargo/bin/rust-lld
#
# Re-run if you `rustup update` to a release that reshuffles bundled tools.
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]
